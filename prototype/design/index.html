<!DOCTYPE html>
<html lang="zh-Hant" data-style="c" data-accent="apple" data-theme="dark" data-wall="mono" data-lab="open">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RingoOS Design Lab</title>
  <meta name="author" content="YoWoRingo">
  <link rel="stylesheet" href="/src/css/system/wm.css">
  <link rel="stylesheet" href="/src/css/system/dock-launcher.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/lab.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <link rel="stylesheet" href="./css/menubar.css">
  <link rel="stylesheet" href="./css/island.css">
</head>
<body>
  <svg class="sr-only" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="ico-light" x1="0" y1="0" x2="1" y2="1">
        <stop class="ico-light-hi" offset="0"/>
        <stop class="ico-light-lo" offset="1"/>
      </linearGradient>
      <linearGradient id="ico-rim" x1="0" y1="0" x2="0" y2="1">
        <stop class="ico-rim-hi" offset="0"/>
        <stop class="ico-rim-lo" offset="0.4"/>
      </linearGradient>
      <filter id="lens-filter" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feFlood flood-color="rgb(128, 128, 128)" result="neutral"/>
        <feImage id="lens-map" preserveAspectRatio="none" result="raw"/>
        <feComposite in="raw" in2="neutral" operator="over" result="map"/>
        <feDisplacementMap id="lens-displace" in="SourceGraphic" in2="map" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="desk" id="desk">
    <div class="wall" id="wall" aria-hidden="true"></div>

    <header class="menubar chrome" id="menubar">
      <span class="menubar__platter" aria-hidden="true"></span>
      <button type="button" class="mb-item mb-brand" data-mb aria-label="RingoOS">Ringo<span class="mb-brand__os">OS</span></button>
      <span class="mb-app"><span class="mb-app__text">桌面</span></span>
      <span class="mb-spacer"></span>
      <span class="mb-radio">
        <button type="button" class="mb-item" data-mb data-open="radio" aria-label="電台播放中">
          <span class="mb-radio__inner">
            <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>電台</span>
          </span>
        </button>
      </span>
      <button type="button" class="mb-item mb-weather" data-mb data-open="weather" aria-label="天氣 27 度">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="i-acc" cx="15" cy="9" r="4"/><path d="M7.5 19h9a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1.2A2.9 2.9 0 0 0 7.5 19z" fill="currentColor"/></svg>
        <span class="mb-temp">27°</span>
      </button>
      <button type="button" class="mb-item mb-bell" data-mb data-open="calendar" aria-label="日程提醒">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2a1.3 1.3 0 0 1 1.3 1.3v.6a5.6 5.6 0 0 1 4.3 5.5v3.6l1.5 2.2a.8.8 0 0 1-.7 1.3H5.6a.8.8 0 0 1-.7-1.3l1.5-2.2v-3.6a5.6 5.6 0 0 1 4.3-5.5v-.6A1.3 1.3 0 0 1 12 3.2zM9.8 19h4.4a2.2 2.2 0 0 1-4.4 0z" fill="currentColor"/></svg>
        <span class="mb-badge" hidden><span class="odo-host"></span></span>
      </button>
      <button type="button" class="mb-item mb-clock" data-mb data-open="calendar">
        <span class="mb-clock__date"></span>
        <span class="mb-clock__time"></span>
      </button>
    </header>

    <div class="island" id="island" data-mode="idle">
      <button type="button" class="island__pill" id="island-pill" aria-expanded="false" aria-controls="island-panel">
        <span class="island__label" id="island-label">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          記一筆
        </span>
      </button>
      <form class="island__panel" id="island-panel" aria-label="快速記一筆">
        <label class="island__row island__amount">
          <span class="island__cur mono">NT$</span>
          <input class="island__input mono" id="island-amount" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="金額">
        </label>
        <div class="island__row island__chips" role="radiogroup" aria-label="分類" data-chips="island">
          <button type="button" class="chip" role="radio" aria-checked="true">餐飲</button>
          <button type="button" class="chip" role="radio" aria-checked="false">交通</button>
          <button type="button" class="chip" role="radio" aria-checked="false">娛樂</button>
          <button type="button" class="chip" role="radio" aria-checked="false">其他</button>
        </div>
        <div class="island__row island__actions">
          <button type="button" class="island__btn" id="island-cancel">取消</button>
          <button type="submit" class="island__btn island__btn--go" data-press>記下</button>
        </div>
      </form>
      <div class="island__activity" id="island-activity" aria-live="polite">
        <svg class="island__badge" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="island__ring" cx="12" cy="12" r="10.6" pathLength="1" transform="rotate(-90 12 12)"/>
          <circle class="island__fill" cx="12" cy="12" r="11.2"/>
          <path class="island__tick" d="M7.3 12.3l3.1 3.1 6.3-6.8" pathLength="1"/>
        </svg>
        <span class="island__activity-text"></span>
        <span class="island__activity-amount mono"><span class="odo-host"></span></span>
      </div>
    </div>

    <main class="wm-area" id="wm-area"></main>

    <div class="notices" id="notices" aria-live="polite"></div>

    <nav class="dock" id="dock" aria-label="Dock"></nav>

    <aside class="lab chrome" id="lab" aria-label="設計實驗室">
      <div class="lab__head">
        <span class="lab__title">設計實驗室</span>
        <button type="button" class="lab__toggle" id="lab-toggle" aria-expanded="true" aria-controls="lab-body">收起</button>
      </div>
      <div class="lab__body" id="lab-body">
        <div class="lab__group">
          <span class="tag">Style · 風格</span>
          <div class="lab__opts">
            <button type="button" class="lab__opt" data-set="style" data-value="a">A 混合玻璃</button>
            <button type="button" class="lab__opt" data-set="style" data-value="c">C 首爾單色</button>
          </div>
        </div>
        <div class="lab__group">
          <span class="tag">Accent · 簽名色</span>
          <div class="lab__opts">
            <button type="button" class="lab__opt" data-set="accent" data-value="apple"><span class="lab__swatch lab__swatch--apple"></span>青蘋果</button>
            <button type="button" class="lab__opt" data-set="accent" data-value="signal"><span class="lab__swatch lab__swatch--signal"></span>信號橘</button>
            <button type="button" class="lab__opt" data-set="accent" data-value="ultramarine"><span class="lab__swatch lab__swatch--ultramarine"></span>群青</button>
          </div>
        </div>
        <div class="lab__group">
          <span class="tag">Theme · 外觀</span>
          <div class="lab__opts">
            <button type="button" class="lab__opt" data-set="theme" data-value="light">淺色</button>
            <button type="button" class="lab__opt" data-set="theme" data-value="dark">深色</button>
          </div>
        </div>
        <div class="lab__group">
          <span class="tag">Wallpaper · 桌布</span>
          <div class="lab__opts">
            <button type="button" class="lab__opt" data-set="wall" data-value="aurora">極光</button>
            <button type="button" class="lab__opt" data-set="wall" data-value="mono">單色</button>
            <button type="button" class="lab__opt" data-set="wall" data-value="photo" id="lab-photo">我的圖片</button>
            <input type="file" accept="image/*" id="lab-photo-input" hidden>
          </div>
        </div>
        <div class="lab__group">
          <span class="tag">Events · 事件</span>
          <div class="lab__opts">
            <button type="button" class="lab__opt" id="lab-radio" aria-pressed="false">電台播放</button>
            <button type="button" class="lab__opt" id="lab-remind">日曆提醒 +1</button>
            <button type="button" class="lab__opt" id="lab-notify">來一則通知</button>
          </div>
        </div>
        <div class="lab__actions">
          <button type="button" class="lab__opt" id="lab-replay">重播開場</button>
        </div>
        <div class="lab__perf mono" id="lab-perf"><span>—</span><span></span></div>
      </div>
    </aside>
  </div>

  <div class="app-sources" id="app-sources" hidden>
    <div class="app-source" data-app-id="daily-entry">
      <div class="app-source__titlebar">
        <span class="tag" id="entry-date"></span>
      </div>
      <div class="win__body">
        <div class="seg" role="tablist" aria-label="支出或收入" id="entry-seg">
          <span class="seg__platter" aria-hidden="true"><span class="seg__blob"></span></span>
          <span class="seg__lens" aria-hidden="true"></span>
          <button type="button" class="seg__btn" role="tab" aria-selected="true">支出</button>
          <button type="button" class="seg__btn" role="tab" aria-selected="false">收入</button>
        </div>
        <label class="amount">
          <span class="amount__cur mono">NT$</span>
          <input class="amount__input" id="entry-amount" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="金額">
        </label>
        <div class="chips" role="radiogroup" aria-label="分類" data-chips="entry"></div>
        <input class="field" id="entry-note" placeholder="備註，例如：晚餐、捷運儲值" aria-label="備註">
        <button type="button" class="btn btn--primary" id="entry-add" data-press>記下這筆</button>
        <div class="list">
          <div class="list__head">
            <span class="tag">Today · 今天</span>
            <span class="list__total mono" id="entry-total"></span>
          </div>
          <div id="entry-rows"></div>
        </div>
      </div>
    </div>

    <div class="app-source" data-app-id="overview">
      <div class="app-source__titlebar">
        <span class="tag" id="overview-month"></span>
      </div>
      <div class="win__body">
        <div class="ov-head">
          <span class="ov-head__label">本月支出</span>
          <span class="tag" id="overview-range"></span>
        </div>
        <div class="big">
          <span class="big__cur">NT$</span>
          <span class="big__num" id="ov-expense"></span>
        </div>
        <div class="budget">
          <div class="budget__track"><span class="budget__fill" id="ov-budget-fill"></span></div>
          <div class="budget__legend"><span>預算 NT$ 24,000</span><span id="ov-budget-pct"></span></div>
        </div>
        <div class="stats">
          <div>
            <div class="stat__label">收入</div>
            <div class="stat__value stat__value--strong mono">+42,000</div>
          </div>
          <div>
            <div class="stat__label">淨額</div>
            <div class="stat__value mono" id="ov-net"></div>
          </div>
        </div>
        <div>
          <div class="ov-head"><span class="ov-head__label">近 7 天</span><span class="tag">Daily spend</span></div>
          <div class="chart" id="ov-chart"></div>
          <div class="chart__labels" id="ov-chart-labels"></div>
        </div>
        <div class="rank" id="ov-rank"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
