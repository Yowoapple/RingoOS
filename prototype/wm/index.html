<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RingoOS Window Manager Prototype</title>
  <meta name="author" content="YoWoRingo">
  <link rel="stylesheet" href="/src/css/system/wm.css">
  <link rel="stylesheet" href="/src/css/system/dock-launcher.css">
  <link rel="stylesheet" href="./prototype.css">
</head>
<body>
  <div class="proto" id="proto">
    <div class="proto-backdrop" id="proto-backdrop" aria-hidden="true"></div>
    <p class="proto-hint" id="proto-hint">點 Dock 圖示開啟 App</p>
    <div class="proto-pet" aria-hidden="true">[桌寵]</div>

    <header class="proto-menubar">
      <span class="proto-menubar__brand">RingoOS</span>
      <span class="proto-menubar__app" id="proto-focused"></span>
      <span class="proto-menubar__spacer"></span>
      <span id="proto-clock"></span>
      <button type="button" class="proto-menubar__button" id="tweaks-toggle" aria-expanded="false" aria-controls="tweaks">Tweaks</button>
    </header>

    <main class="wm-area" id="wm-area"></main>
    <nav class="dock" id="dock" aria-label="Dock"></nav>

    <aside class="tweaks" id="tweaks" hidden aria-label="Tweaks"></aside>
    <div class="proto-hud" id="proto-hud" hidden></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
